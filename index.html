<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Gracefully prevent browser extension errors (e.g., MetaMask, Web3 wallet injection in sandbox iframe)
      (function() {
        function shouldSuppress(msg, source) {
          if (!msg) return false;
          var str = typeof msg === 'string' ? msg : (msg.message || String(msg));
          var src = source ? String(source) : '';
          return (
            str.indexOf('MetaMask') !== -1 ||
            str.indexOf('metamask') !== -1 ||
            str.indexOf('ethereum') !== -1 ||
            str.indexOf('Failed to connect to MetaMask') !== -1 ||
            src.indexOf('chrome-extension://') !== -1 ||
            src.indexOf('moz-extension://') !== -1
          );
        }

        window.addEventListener('error', function(e) {
          if (shouldSuppress(e.message || (e.error && e.error.message), e.filename)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = reason ? (reason.message || String(reason)) : '';
          if (shouldSuppress(msg)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
